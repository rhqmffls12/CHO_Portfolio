<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Version review and render handoff</title><desc id="desc">A simplified status view connecting source control checks to editorial review and render setup.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152127"/><stop offset="1" stop-color="#0b1115"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d0e4db" stroke-opacity=".05"/></pattern></defs>
  <rect width="1440" height="810" fill="url(#bg)"/><rect width="1440" height="810" fill="url(#grid)"/><text x="72" y="76" fill="#8ebc52" font-family="monospace" font-size="15" letter-spacing="3">VERSION REVIEW / RENDER HANDOFF</text><text x="72" y="137" fill="#f1f4ed" font-family="Arial,sans-serif" font-size="38" font-weight="600">See what changed before you hand off.</text>
  <rect x="72" y="196" width="810" height="512" rx="8" fill="#11191d" stroke="#3b4d50"/><text x="108" y="244" fill="#e8eee6" font-family="monospace" font-size="14">SVN PICKER</text><text x="660" y="244" fill="#829492" font-family="monospace" font-size="11">ASYNC STATUS REFRESH</text>
  <g font-family="monospace" font-size="12"><rect x="106" y="278" width="740" height="54" rx="3" fill="#1c282c"/><text x="128" y="311" fill="#9eafb0">PATH</text><text x="516" y="311" fill="#9eafb0">STATUS</text><text x="630" y="311" fill="#9eafb0">REVISION</text><text x="752" y="311" fill="#9eafb0">AUTHOR</text>
  <g fill="#182327" stroke="#293b3f"><rect x="106" y="342" width="740" height="64" rx="3"/><rect x="106" y="414" width="740" height="64" rx="3"/><rect x="106" y="486" width="740" height="64" rx="3"/><rect x="106" y="558" width="740" height="64" rx="3"/></g>
  <g fill="#c8d2cb"><text x="128" y="380">/Content/Assets/World</text><text x="516" y="380">MODIFIED</text><text x="630" y="380">UPDATE READY</text><text x="752" y="380">TEAM</text><text x="128" y="452">/Content/Sequences/Shot</text><text x="516" y="452">ADDED</text><text x="630" y="452">COMMIT</text><text x="752" y="452">LOCAL</text><text x="128" y="524">/Content/Render/Settings</text><text x="516" y="524">MODIFIED</text><text x="630" y="524">COMMIT</text><text x="752" y="524">LOCAL</text><text x="128" y="596">/Content/Assets/Character</text><text x="516" y="596">CURRENT</text><text x="630" y="596">IN SYNC</text><text x="752" y="596">TEAM</text></g>
  <circle cx="498" cy="376" r="5" fill="#d5bc91"/><circle cx="498" cy="448" r="5" fill="#56d5cc"/><circle cx="498" cy="520" r="5" fill="#56d5cc"/><circle cx="498" cy="592" r="5" fill="#8ebc52"/></g><text x="108" y="665" fill="#879896" font-family="Arial,sans-serif" font-size="14">Background polling keeps update and commit work visible without blocking the editor.</text>
  <rect x="920" y="196" width="448" height="512" rx="8" fill="#11191d" stroke="#3b4d50"/><text x="958" y="244" fill="#e8eee6" font-family="monospace" font-size="14">SEQUENCER TOOLBAR</text>
  <g font-family="monospace"><rect x="958" y="280" width="372" height="66" rx="4" fill="#1b282c"/><text x="982" y="307" fill="#8ebc52" font-size="11">01</text><text x="1020" y="310" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Load Level</text><text x="982" y="332" fill="#819493" font-size="10">SHOT CONTEXT → EDITOR</text>
  <rect x="958" y="362" width="372" height="66" rx="4" fill="#1b282c"/><text x="982" y="389" fill="#56d5cc" font-size="11">02</text><text x="1020" y="392" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Test / Low Render</text><text x="982" y="414" fill="#819493" font-size="10">ITERATE WITH PRESETS</text>
  <rect x="958" y="444" width="372" height="66" rx="4" fill="#1b282c"/><text x="982" y="471" fill="#d5bc91" font-size="11">03</text><text x="1020" y="474" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Final Render</text><text x="982" y="496" fill="#819493" font-size="10">MOVIE RENDER QUEUE</text>
  <rect x="958" y="526" width="372" height="66" rx="4" fill="#1b282c"/><text x="982" y="553" fill="#8ebc52" font-size="11">04</text><text x="1020" y="556" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Screening Room</text><text x="982" y="578" fill="#819493" font-size="10">REVIEW LINK / SHOT</text></g><path d="M973 633h342" stroke="#405252"/><text x="958" y="669" fill="#879896" font-family="Arial,sans-serif" font-size="14">A connected path from version check to review and delivery.</text>
  <text x="72" y="770" fill="#788b8b" font-family="monospace" font-size="12" letter-spacing="2">SVN MONITORING / SEQUENCER / MOVIE RENDER QUEUE</text>
</svg>
