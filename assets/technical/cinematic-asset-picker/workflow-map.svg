<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic Asset Picker production workflow</title>
  <desc id="desc">A connected Unreal Engine workflow linking shot context, asset discovery, version review, and rendering.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17242a"/><stop offset="1" stop-color="#0b1115"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#8ebc52"/><stop offset="1" stop-color="#56d5cc"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d0e4db" stroke-opacity=".055"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/><rect width="1440" height="810" fill="url(#grid)"/>
  <text x="72" y="74" fill="#8ebc52" font-family="monospace" font-size="16" letter-spacing="4">CINEMATIC ASSET PICKER / PIPELINE OVERVIEW</text>
  <text x="72" y="132" fill="#f1f4ed" font-family="Arial,sans-serif" font-size="42" font-weight="600">Keep the shot in context.</text>
  <text x="72" y="168" fill="#9eafb0" font-family="Arial,sans-serif" font-size="18">From shot selection to review and render, in one Unreal Editor workflow.</text>
  <path d="M160 372H1280" stroke="#405252" stroke-width="2" stroke-dasharray="5 10"/>
  <path d="M255 372H430M585 372H760M915 372H1090" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
  <g font-family="monospace">
    <g transform="translate(72 248)"><rect width="300" height="248" rx="8" fill="#111a1e" stroke="#405252"/><text x="24" y="34" fill="#8ebc52" font-size="13" letter-spacing="2">01 / SHOT CONTEXT</text><text x="24" y="82" fill="#edf2e8" font-family="Arial,sans-serif" font-size="26" font-weight="600">ShotGrid</text><text x="24" y="111" fill="#9eafb0" font-family="Arial,sans-serif" font-size="15">Project · sequence · task</text><rect x="24" y="142" width="252" height="70" rx="4" fill="#1b282c"/><circle cx="47" cy="166" r="6" fill="#8ebc52"/><text x="63" y="170" fill="#e1e8dd" font-size="12">SHOT / STATUS / ASSIGNEE</text><path d="M40 190h60m14 0h68m14 0h56" stroke="#546667" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(397 248)"><rect width="300" height="248" rx="8" fill="#111a1e" stroke="#405252"/><text x="24" y="34" fill="#8ebc52" font-size="13" letter-spacing="2">02 / DISCOVER</text><text x="24" y="82" fill="#edf2e8" font-family="Arial,sans-serif" font-size="26" font-weight="600">Asset Pickers</text><text x="24" y="111" fill="#9eafb0" font-family="Arial,sans-serif" font-size="15">Sequences · worlds · characters</text><g fill="#26363a" stroke="#43585a"><rect x="24" y="145" width="70" height="66" rx="3"/><rect x="108" y="145" width="70" height="66" rx="3"/><rect x="192" y="145" width="84" height="66" rx="3"/></g><path d="M34 191l18-22 17 16 14-12 11 18m22 0 19-25 17 17 12-10 8 18m22 0 22-22 17 12 12-9 11 19" fill="none" stroke="#8ebc52" stroke-width="2"/><text x="38" y="230" fill="#aebcba" font-size="11">CONTENT BROWSER × 4</text></g>
    <g transform="translate(722 248)"><rect width="300" height="248" rx="8" fill="#111a1e" stroke="#405252"/><text x="24" y="34" fill="#8ebc52" font-size="13" letter-spacing="2">03 / REVIEW</text><text x="24" y="82" fill="#edf2e8" font-family="Arial,sans-serif" font-size="26" font-weight="600">Version Status</text><text x="24" y="111" fill="#9eafb0" font-family="Arial,sans-serif" font-size="15">SVN changes · review link</text><rect x="24" y="142" width="252" height="70" rx="4" fill="#1b282c"/><circle cx="47" cy="166" r="6" fill="#56d5cc"/><text x="63" y="170" fill="#e1e8dd" font-size="12">BACKGROUND REVISION CHECK</text><text x="40" y="198" fill="#9eafb0" font-size="11">UPDATE  02</text><text x="164" y="198" fill="#9eafb0" font-size="11">COMMIT  04</text><path d="M39 219h216" stroke="#56d5cc" stroke-width="2"/></g>
    <g transform="translate(1047 248)"><rect width="300" height="248" rx="8" fill="#111a1e" stroke="#405252"/><text x="24" y="34" fill="#8ebc52" font-size="13" letter-spacing="2">04 / DELIVER</text><text x="24" y="82" fill="#edf2e8" font-family="Arial,sans-serif" font-size="26" font-weight="600">Sequencer</text><text x="24" y="111" fill="#9eafb0" font-family="Arial,sans-serif" font-size="15">Level · MRQ · frame setup</text><rect x="24" y="145" width="252" height="66" rx="4" fill="#1b282c"/><path d="M42 169h48m9 0h57m8 0h92M42 190h84m9 0h32m10 0h70" stroke="#546667" stroke-width="5" stroke-linecap="round"/><circle cx="253" cy="169" r="8" fill="#8ebc52"/><text x="39" y="232" fill="#aebcba" font-size="11">TEST → FINAL RENDER</text></g>
  </g>
  <rect x="72" y="566" width="1275" height="1" fill="#405252"/>
  <text x="72" y="614" fill="#f1f4ed" font-family="Arial,sans-serif" font-size="19" font-weight="600">ENGINE INTEGRATION</text>
  <g font-family="monospace" font-size="13" letter-spacing="1.5" fill="#b8c6bf"><text x="72" y="660">UNREAL ENGINE 5.7</text><text x="350" y="660">C++ / SLATE</text><text x="560" y="660">PYTHON BRIDGE</text><text x="790" y="660">SHOTGRID API</text><text x="1010" y="660">SVN</text><text x="1140" y="660">MOVIE RENDER QUEUE</text></g>
  <text x="72" y="752" fill="#788b8b" font-family="monospace" font-size="12" letter-spacing="2">EDITOR TOOLING / CINEMATIC PRODUCTION PIPELINE</text>
</svg>
