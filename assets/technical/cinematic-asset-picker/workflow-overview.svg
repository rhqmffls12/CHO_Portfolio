<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic Workflow Toolkit for Unreal Engine</title>
  <desc id="desc">A six-stage cinematic production workflow from Maya through FBX export, Unreal setup, animation conversion, render setup, and Movie Render Queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111713"/><stop offset="1" stop-color="#1b241e"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#c8e36a"/><stop offset="1" stop-color="#85b442"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#242e27"/><stop offset="1" stop-color="#1b231e"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M1 1 9 6 1 11" fill="none" stroke="#91b94d" stroke-width="1.7"/></marker>
    <style>
      .mono{font-family:'DM Mono','Consolas',monospace;letter-spacing:2px}
      .sans{font-family:'Manrope','Arial',sans-serif}
      .muted{fill:#a6b0a7}.soft{fill:#77847a}.white{fill:#f2f3ed}.green{fill:#c7df79}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1650" cy="140" r="260" fill="#8cae42" opacity=".08" filter="url(#soft)"/>
  <path d="M72 70H1848" stroke="#657267" stroke-opacity=".35"/>
  <text x="76" y="54" class="mono green" font-size="17">CHO SEUNGHYUN  /  TECHNICAL ART</text>
  <text x="1844" y="54" text-anchor="end" class="mono muted" font-size="16">CINEMATIC PIPELINE  ·  2021—2026</text>

  <text x="76" y="150" class="mono green" font-size="18">FROM MAYA SCENE TO FINAL FRAME</text>
  <text x="72" y="232" class="sans white" font-size="66" font-weight="700" letter-spacing="-2">Cinematic Workflow Toolkit</text>
  <text x="76" y="284" class="sans muted" font-size="25">A connected, shot-based workflow for setup, animation, and rendering inside Unreal Engine.</text>

  <g transform="translate(76 356)">
    <!-- Flow connectors -->
    <path d="M278 180H316M576 180H614M874 180H912M1172 180H1210M1470 180H1508" fill="none" stroke="#91b94d" stroke-width="2" stroke-opacity=".8" marker-end="url(#arrow)"/>
    <!-- Card 1 -->
    <g transform="translate(0)">
      <rect width="278" height="360" rx="8" fill="url(#panel)" stroke="#59665b" stroke-opacity=".7"/>
      <rect width="278" height="5" rx="2" fill="url(#accent)"/>
      <text x="24" y="42" class="mono green" font-size="14">01  /  SOURCE</text>
      <text x="24" y="101" class="sans white" font-size="28" font-weight="700">Maya Scene</text>
      <text x="24" y="145" class="sans muted" font-size="17">Shot-ready source</text>
      <path d="M24 174H254" stroke="#617064" stroke-opacity=".45"/>
      <circle cx="31" cy="213" r="4" fill="#b8d86b"/><text x="47" y="219" class="sans white" font-size="16">Camera</text>
      <circle cx="31" cy="250" r="4" fill="#b8d86b"/><text x="47" y="256" class="sans white" font-size="16">Animation</text>
      <circle cx="31" cy="287" r="4" fill="#b8d86b"/><text x="47" y="293" class="sans white" font-size="16">Shot data</text>
      <text x="24" y="335" class="mono soft" font-size="12">AUTHOR  ·  PREPARE</text>
    </g>
    <!-- Card 2 -->
    <g transform="translate(316)">
      <rect width="260" height="360" rx="8" fill="url(#panel)" stroke="#59665b" stroke-opacity=".7"/>
      <rect width="260" height="5" rx="2" fill="url(#accent)"/>
      <text x="22" y="42" class="mono green" font-size="14">02  /  TRANSFER</text>
      <text x="22" y="101" class="sans white" font-size="28" font-weight="700">FBX Export</text>
      <text x="22" y="145" class="sans muted" font-size="17">Maya → Unreal</text>
      <path d="M22 174H238" stroke="#617064" stroke-opacity=".45"/>
      <rect x="22" y="199" width="216" height="72" rx="5" fill="#141b16" stroke="#64715c" stroke-opacity=".6"/>
      <text x="130" y="229" text-anchor="middle" class="mono green" font-size="16">CAMERA + ANIM</text>
      <text x="130" y="252" text-anchor="middle" class="mono muted" font-size="12">.FBX</text>
      <text x="22" y="335" class="mono soft" font-size="12">EXPORT  ·  PACKAGE</text>
    </g>
    <!-- Card 3 -->
    <g transform="translate(614)">
      <rect width="260" height="360" rx="8" fill="url(#panel)" stroke="#59665b" stroke-opacity=".7"/>
      <rect width="260" height="5" rx="2" fill="url(#accent)"/>
      <text x="22" y="42" class="mono green" font-size="14">03  /  WORKSPACE</text>
      <text x="22" y="94" class="sans white" font-size="26" font-weight="700">Unreal Workflow</text>
      <text x="22" y="127" class="sans white" font-size="26" font-weight="700">Setup</text>
      <path d="M22 153H238" stroke="#617064" stroke-opacity=".45"/>
      <circle cx="29" cy="190" r="4" fill="#b8d86b"/><text x="45" y="196" class="sans white" font-size="15">Select project &amp; shot</text>
      <circle cx="29" cy="228" r="4" fill="#b8d86b"/><text x="45" y="234" class="sans white" font-size="15">SVN update / commit</text>
      <circle cx="29" cy="266" r="4" fill="#b8d86b"/><text x="45" y="272" class="sans white" font-size="15">Locate assets &amp; levels</text>
      <text x="22" y="335" class="mono soft" font-size="12">SYNC  ·  ORGANIZE</text>
    </g>
    <!-- Card 4 -->
    <g transform="translate(912)">
      <rect width="260" height="360" rx="8" fill="url(#panel)" stroke="#59665b" stroke-opacity=".7"/>
      <rect width="260" height="5" rx="2" fill="url(#accent)"/>
      <text x="22" y="42" class="mono green" font-size="14">04  /  BUILD</text>
      <text x="22" y="94" class="sans white" font-size="25" font-weight="700">Animation &amp;</text>
      <text x="22" y="126" class="sans white" font-size="25" font-weight="700">Sequence</text>
      <path d="M22 153H238" stroke="#617064" stroke-opacity=".45"/>
      <circle cx="29" cy="190" r="4" fill="#b8d86b"/><text x="45" y="196" class="sans white" font-size="15">Import &amp; convert FBX</text>
      <circle cx="29" cy="228" r="4" fill="#b8d86b"/><text x="45" y="234" class="sans white" font-size="15">Set up shot sequence</text>
      <circle cx="29" cy="266" r="4" fill="#b8d86b"/><text x="45" y="272" class="sans white" font-size="15">Load shot level</text>
      <text x="22" y="335" class="mono soft" font-size="12">IMPORT  ·  ASSEMBLE</text>
    </g>
    <!-- Card 5 -->
    <g transform="translate(1210)">
      <rect width="260" height="360" rx="8" fill="url(#panel)" stroke="#59665b" stroke-opacity=".7"/>
      <rect width="260" height="5" rx="2" fill="url(#accent)"/>
      <text x="22" y="42" class="mono green" font-size="14">05  /  PREPARE</text>
      <text x="22" y="101" class="sans white" font-size="28" font-weight="700">Render Setup</text>
      <text x="22" y="145" class="sans muted" font-size="16">Apply shot settings</text>
      <path d="M22 174H238" stroke="#617064" stroke-opacity=".45"/>
      <rect x="22" y="195" width="216" height="34" rx="4" fill="#29342b"/><text x="36" y="218" class="sans white" font-size="14">Final Render</text>
      <rect x="22" y="239" width="216" height="34" rx="4" fill="#29342b"/><text x="36" y="262" class="sans white" font-size="14">Low Render</text>
      <rect x="22" y="283" width="216" height="34" rx="4" fill="#29342b"/><text x="36" y="306" class="sans white" font-size="14">Test Render</text>
      <text x="22" y="345" class="mono soft" font-size="11">LEVEL  ·  RENDER PRESET</text>
    </g>
    <!-- Card 6 -->
    <g transform="translate(1508)">
      <rect width="260" height="360" rx="8" fill="#2a372c" stroke="#9abb57" stroke-opacity=".85"/>
      <rect width="260" height="5" rx="2" fill="url(#accent)"/>
      <text x="22" y="42" class="mono green" font-size="14">06  /  OUTPUT</text>
      <text x="22" y="94" class="sans white" font-size="26" font-weight="700">Movie Render</text>
      <text x="22" y="127" class="sans white" font-size="26" font-weight="700">Queue</text>
      <path d="M22 153H238" stroke="#9abb57" stroke-opacity=".45"/>
      <rect x="22" y="184" width="216" height="94" rx="5" fill="#18211a" stroke="#8aab4c" stroke-opacity=".65"/>
      <path d="M45 212H212M45 232H212M45 252H181" stroke="#879881" stroke-width="4" stroke-linecap="round"/>
      <circle cx="210" cy="252" r="7" fill="#c7df79"/>
      <text x="22" y="335" class="mono green" font-size="12">BATCH  ·  RENDER</text>
    </g>
  </g>

  <rect x="76" y="794" width="1768" height="1" fill="#657267" opacity=".4"/>
  <text x="76" y="849" class="mono green" font-size="15">ONE TOOL, CONNECTED SHOT WORKFLOW</text>
  <text x="76" y="893" class="sans muted" font-size="19">Shot-specific levels and render presets flow into Movie Render Queue jobs—reducing repetitive setup across sequences.</text>
  <g transform="translate(76 950)">
    <rect width="1768" height="56" rx="5" fill="#131a15" stroke="#566356" stroke-opacity=".55"/>
    <text x="24" y="35" class="mono soft" font-size="13">MAYA</text><text x="124" y="35" class="green" font-size="17">→</text>
    <text x="164" y="35" class="mono soft" font-size="13">FBX</text><text x="258" y="35" class="green" font-size="17">→</text>
    <text x="298" y="35" class="mono soft" font-size="13">UNREAL WORKFLOW SETUP</text><text x="555" y="35" class="green" font-size="17">→</text>
    <text x="595" y="35" class="mono soft" font-size="13">ANIMATION + SEQUENCE</text><text x="842" y="35" class="green" font-size="17">→</text>
    <text x="882" y="35" class="mono soft" font-size="13">RENDER SETUP</text><text x="1054" y="35" class="green" font-size="17">→</text>
    <text x="1094" y="35" class="mono green" font-size="13">MOVIE RENDER QUEUE</text>
    <text x="1744" y="35" text-anchor="end" class="mono muted" font-size="12">C++  ·  SLATE  ·  PYTHON  ·  SVN</text>
  </g>
  <text x="1844" y="1046" text-anchor="end" class="mono soft" font-size="12">CINEMATIC WORKFLOW TOOLKIT FOR UNREAL ENGINE  /  01</text>
</svg>
