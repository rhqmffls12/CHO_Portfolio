<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Shot context and asset discovery</title><desc id="desc">A generic shot list concept showing status, task context, and linked level and render assets.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#152127"/><stop offset="1" stop-color="#0b1115"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d0e4db" stroke-opacity=".05"/></pattern></defs>
  <rect width="1440" height="810" fill="url(#bg)"/><rect width="1440" height="810" fill="url(#grid)"/><text x="72" y="76" fill="#8ebc52" font-family="monospace" font-size="15" letter-spacing="3">SHOT CONTEXT / ASSET DISCOVERY</text><text x="72" y="137" fill="#f1f4ed" font-family="Arial,sans-serif" font-size="38" font-weight="600">A shot card becomes a working hub.</text>
  <rect x="72" y="196" width="1296" height="526" rx="8" fill="#11191d" stroke="#3b4d50"/><rect x="72" y="196" width="1296" height="54" rx="8" fill="#1a2529"/><text x="104" y="230" fill="#dce5dc" font-family="monospace" font-size="13">SHOT LIST</text><text x="1130" y="230" fill="#8ebc52" font-family="monospace" font-size="12">PROJECT  /  SEQUENCE  /  MINE ONLY</text>
  <g font-family="monospace"><rect x="100" y="280" width="1238" height="102" rx="5" fill="#182327" stroke="#4d665d"/><rect x="118" y="298" width="112" height="66" rx="3" fill="#334348"/><path d="M124 352l26-35 23 20 19-15 32 30" fill="none" stroke="#8ebc52" stroke-width="3"/><text x="258" y="315" fill="#f1f4ed" font-family="Arial,sans-serif" font-size="20" font-weight="600">SHOT CARD</text><text x="258" y="343" fill="#a9b9b6" font-size="12">STATUS  /  TASKS  /  FILMSTRIP</text><rect x="760" y="301" width="98" height="30" rx="3" fill="#31443c"/><text x="781" y="321" fill="#b9d58b" font-size="11">LAYOUT</text><rect x="868" y="301" width="90" height="30" rx="3" fill="#26373b"/><text x="890" y="321" fill="#a9b9b6" font-size="11">ANIM</text><rect x="968" y="301" width="80" height="30" rx="3" fill="#26373b"/><text x="987" y="321" fill="#a9b9b6" font-size="11">SIM</text><rect x="1058" y="301" width="70" height="30" rx="3" fill="#26373b"/><text x="1076" y="321" fill="#a9b9b6" font-size="11">FX</text><text x="1160" y="320" fill="#9eafb0" font-size="11">ASSIGNED</text><rect x="258" y="353" width="185" height="14" rx="7" fill="#2c393d"/><rect x="258" y="353" width="122" height="14" rx="7" fill="#8ebc52"/>
  <text x="112" y="426" fill="#8ebc52" font-size="12" letter-spacing="2">LINKED SHOT ASSETS</text><g><rect x="110" y="455" width="360" height="112" rx="5" fill="#182327" stroke="#34474b"/><text x="136" y="490" fill="#8ebc52" font-size="14">LV</text><text x="190" y="490" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Level</text><text x="190" y="523" fill="#809392" font-size="11">OPEN IN CONTENT BROWSER</text><path d="M425 493l12 12-12 12" fill="none" stroke="#8ebc52" stroke-width="2"/>
  <rect x="500" y="455" width="360" height="112" rx="5" fill="#182327" stroke="#34474b"/><text x="526" y="490" fill="#56d5cc" font-size="14">FR</text><text x="580" y="490" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Final Render Set</text><text x="580" y="523" fill="#809392" font-size="11">SHOT-LEVEL RENDER PRESET</text><path d="M815 493l12 12-12 12" fill="none" stroke="#8ebc52" stroke-width="2"/>
  <rect x="890" y="455" width="420" height="112" rx="5" fill="#182327" stroke="#34474b"/><text x="916" y="490" fill="#d5bc91" font-size="14">LR</text><text x="970" y="490" fill="#e1e8dd" font-family="Arial,sans-serif" font-size="17">Low Render Set</text><text x="970" y="523" fill="#809392" font-size="11">QUICK ITERATION PRESET</text><path d="M1265 493l12 12-12 12" fill="none" stroke="#8ebc52" stroke-width="2"/></g>
  </g><text x="112" y="644" fill="#9eafb0" font-family="Arial,sans-serif" font-size="17">Filter to the assigned work, inspect its state, then jump straight to the assets that support it.</text><text x="72" y="770" fill="#788b8b" font-family="monospace" font-size="12" letter-spacing="2">SHOT LIST TAB / FILTERS / STATUS / ASSET LINKS</text>
</svg>
